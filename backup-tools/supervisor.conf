[program:rootdmd-git-backup]
command=/bin/bash /rootDMD/backup-tools/backup-loop.sh
directory=/rootDMD
environment=PATH="/usr/local/bin:/usr/bin:/bin",HOME="/root",GIT_TERMINAL_PROMPT="0"
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
umask=077
redirect_stderr=true
stdout_logfile=/rootDMD/backup-tools/backup.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
